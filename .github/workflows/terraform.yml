# CI/CD do Repo 2 — VPC + EKS + ECR.
#
#   PR para main      -> fmt + init + validate + plan   (nunca aplica)
#   push na main      -> apply -auto-approve            (deploy automático exigido pelo desafio)
#   workflow_dispatch -> plan | apply | destroy         (o destroy é a alavanca de custo entre sessões)
#
# 🔴 As credenciais do AWS Academy são TEMPORÁRIAS (~4h) e incluem session token. Elas expiram
#    entre sessões e derrubam qualquer job: por isso o primeiro passo útil é um sts get-caller-identity
#    com mensagem de erro explícita. Renove com scripts/refresh-gh-secrets.ps1.

name: Terraform - Infra K8s (VPC + EKS + ECR)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      action:
        description: "O que executar"
        type: choice
        required: true
        default: plan
        options: [ plan, apply, destroy ]

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  # Os nomes dos roles do EKS não têm default no Terraform: o lab os cria por CloudFormation com
  # sufixo gerado, único por instância do laboratório (não é "LabEksClusterRole" puro). Vêm das
  # repository variables, populadas por scripts/refresh-gh-secrets.ps1 com os valores do preflight.
  TF_VAR_cluster_role_name: ${{ vars.CLUSTER_ROLE_NAME }}
  TF_VAR_node_role_name: ${{ vars.NODE_ROLE_NAME }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      # Falha rápido e com instrução acionável — sem isto o erro aparece lá na frente, no plan,
      # como um "ExpiredToken" no meio de 200 linhas de output.
      - name: Check lab session
        run: |
          if ! aws sts get-caller-identity > /dev/null; then
            echo "::error::Credencial do AWS Academy expirou (a sessao dura ~4h)."
            echo "::error::Abra o lab, atualize ~/.aws/credentials e rode scripts/refresh-gh-secrets.ps1 -Org <org>."
            exit 1
          fi
          aws sts get-caller-identity

      - name: Fail fast if EKS role variables are missing
        run: |
          if [ -z "${{ vars.CLUSTER_ROLE_NAME }}" ] || [ -z "${{ vars.NODE_ROLE_NAME }}" ]; then
            echo "::error::As repository variables CLUSTER_ROLE_NAME e NODE_ROLE_NAME sao obrigatorias."
            echo "::error::Os nomes reais tem sufixo gerado pelo lab e mudam se o laboratorio for resetado."
            echo "::error::Rode scripts/preflight.ps1 e depois scripts/refresh-gh-secrets.ps1 -Org <org>"
            echo "::error::  -ClusterRoleName <valor> -NodeRoleName <valor> -StateBucket <bucket>."
            exit 1
          fi

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          # Mesma versão da máquina do dono: evita divergência de formato de state entre local e CI.
          terraform_version: 1.15.4
          terraform_wrapper: false

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      # Config parcial do backend: o bucket depende da conta do lab, então não pode ser literal no
      # versions.tf. Mesmo bucket dos outros repos de infra, key diferente.
      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=infra-k8s/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        if: github.event_name != 'workflow_dispatch' || inputs.action != 'destroy'
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          {
            echo "### Terraform plan"
            echo '```'
            tail -n 60 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Deploy automático no merge (requisito do desafio). PR nunca aplica.
      - name: Terraform apply
        if: |
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
        run: terraform apply -auto-approve tfplan

      # Só manual. É como a infra é derrubada ao fim da sessão sem depender da máquina do dono.
      # ⚠️ A partir do Bloco 4: apague antes os Services do tipo LoadBalancer — o ELB deixa ENI nas
      # subnets e o destroy da VPC trava.
      - name: Terraform destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
        run: terraform destroy -auto-approve

      - name: Show outputs
        if: success() && github.event_name != 'pull_request'
        run: terraform output || true
